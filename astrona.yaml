- id: module-010
  title: 'Observability Fundamentals: Traces, Metrics, Logs, and Events'
  description: Makes the reader able to tell metrics, logs and events apart, write
    and read structured log records, use Kubernetes events, correlate a symptom in
    a metric with a log record, and judge what collection, sampling, retention and
    sensitive data allow a log search to prove.
  status: alpha
