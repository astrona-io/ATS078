# Course manifest for ATS078. Each section lists its README, modules (landing, parts, lab Question reading and lab entry after the part tested, summary), a capstone and a quiz.
training:
  id: ATS078
  title: 'CNPA: Platform Observability, Security, and Conformance'
  description: 'Concept lessons, playgrounds, graded labs, capstones and original
    scenario quizzes for CNPA: Platform Observability, Security, and Conformance.
    Labs run on kind (Kubernetes 1.35). Labs are built but not yet run.'
  certification:
    name: Certified Cloud Native Platform Engineering Associate
    code: CNPA
    provider: CNCF / Linux Foundation
    domain: Platform Observability, Security, and Conformance
    weight: 20
    competencies:
    - 'Observability Fundamentals: Traces, Metrics, Logs, and Events'
    - Secure Service Communication
    - Policy Engines for Platform Governance
    - Kubernetes Security Essentials
    - Security in CI/CD Pipelines
modules:
- id: module-intro
  title: Introduction
  description: Audience, reading method and review process.
  content:
