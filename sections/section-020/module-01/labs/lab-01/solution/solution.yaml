apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: starfleet
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: scout-metrics
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: scout
  mtls:
    mode: STRICT
  portLevelMtls:
    9797:
      mode: PERMISSIVE
