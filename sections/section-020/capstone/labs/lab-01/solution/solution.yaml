apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: starfleet
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: scout-metrics
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: scout
  mtls:
    mode: STRICT
  portLevelMtls:
    9797:
      mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: scout-allow
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: scout
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/starfleet/sa/shuttle"]
      to:
        - operation:
            methods: ["GET"]
            ports: ["9898"]
    - to:
        - operation:
            methods: ["GET"]
            ports: ["9797"]
