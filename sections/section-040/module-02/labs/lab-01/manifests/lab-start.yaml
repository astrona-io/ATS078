apiVersion: v1
kind: Namespace
metadata:
  name: bridge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scout-sa
  namespace: bridge
---
apiVersion: v1
kind: Secret
metadata:
  name: scout-sa-token
  namespace: bridge
  annotations:
    kubernetes.io/service-account.name: scout-sa
type: kubernetes.io/service-account-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: bridge
  labels:
    app: scout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      serviceAccountName: scout-sa
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - containerPort: 9898
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
