# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Authorization Capstone (LAB). Graded against the live cluster. Remove four excessive grants without breaking required access.
apiVersion: astrona.io/v1
metadata:
  name: ats-078-capstone-040
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0

bootstrap:
  init:
    - name: seed-cluster
      description: Create the starting state, including the faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by astrona test: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: crew-scope
      description: crew has no cluster-admin binding, can list pods in ward and cannot read Secrets or list pods in kube-system
      type: file
      source: validation/validate-crew-scope.sh
      hint: Delete the ClusterRoleBinding to cluster-admin and give crew the view ClusterRole with a RoleBinding in ward. view does not include Secrets.
    - name: builder-no-escalation
      description: builder-sa can create roles in ward but has no bind or escalate permission
      type: file
      source: validation/validate-builder-no-escalation.sh
      hint: Edit Role rolemaker. Remove the bind and escalate verbs and keep create, get, list and update.
    - name: reader-no-secrets
      description: reader-sa can read configmaps in ward and cannot read or list Secrets
      type: file
      source: validation/validate-reader-no-secrets.sh
      hint: Remove secrets from Role config-reader. Keep configmaps.
    - name: no-unauthenticated
      description: No binding grants a role to system:unauthenticated in ward and anonymous cannot list pods
      type: file
      source: validation/validate-no-unauthenticated.sh
      hint: Delete the RoleBinding public-pods.
    - name: no-wildcards
      description: No Role in ward uses a wildcard, bind, escalate or impersonate
      type: file
      source: validation/validate-no-wildcards.sh
      hint: Check every Role in ward, including the ones you edited.
    - name: scout-intact
      description: Deployment scout in ward is still available
      type: file
      source: validation/validate-scout-intact.sh
      hint: Change only RBAC objects.

teardown:
  keepCluster: false
