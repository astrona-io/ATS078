apiVersion: apps/v1
kind: Deployment
metadata:
  name: build-runner
  namespace: forge
  labels:
    app: build-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: build-runner
  template:
    metadata:
      labels:
        app: build-runner
    spec:
      serviceAccountName: build-runner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: build-runner
          image: mccutchen/go-httpbin@DIGEST_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: registry-token
              mountPath: /etc/build-runner
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: registry-token
          secret:
            secretName: registry-token
